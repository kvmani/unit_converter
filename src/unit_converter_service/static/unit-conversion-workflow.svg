<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Dimension-aware unit conversion</title><desc id="d">Magnitude and unit flow through registry resolution, dimensional validation, scale or offset transformation, and formatted output.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#567c54"/></marker></defs><rect width="900" height="440" rx="26" fill="#edf4ea"/><rect x="28" y="28" width="844" height="70" rx="16" fill="#284629"/><text x="55" y="58" fill="#bfe5bc" font-family="Arial" font-size="13" font-weight="700">SAME PHYSICAL QUANTITY</text><text x="55" y="83" fill="white" font-family="Arial" font-size="21" font-weight="700">Parse → resolve → check → transform → report</text><g font-family="Arial"><g transform="translate(35 145)"><rect width="145" height="118" rx="14" fill="white" stroke="#cbd9c6"/><text x="15" y="29" fill="#b84d45" font-size="12" font-weight="700">01 INPUT</text><text x="15" y="59" fill="#284629" font-size="17" font-weight="700">Value + unit</text><text x="15" y="88" fill="#627060" font-size="12">absolute / interval</text></g><g transform="translate(205 145)"><rect width="145" height="118" rx="14" fill="#e3efe0" stroke="#567c54"/><text x="15" y="29" fill="#456b43" font-size="12" font-weight="700">02 REGISTRY</text><text x="15" y="59" fill="#284629" font-size="17" font-weight="700">Resolve</text><text x="15" y="88" fill="#627060" font-size="12">aliases · prefixes</text></g><g transform="translate(375 145)"><rect width="145" height="118" rx="14" fill="white" stroke="#cbd9c6"/><text x="15" y="29" fill="#b84d45" font-size="12" font-weight="700">03 VALIDATE</text><text x="15" y="59" fill="#284629" font-size="17" font-weight="700">Dimensions</text><text x="15" y="88" fill="#627060" font-size="12">source = target</text></g><g transform="translate(545 145)"><rect width="145" height="118" rx="14" fill="#fff4e8" stroke="#e6b078"/><text x="15" y="29" fill="#b95a3e" font-size="12" font-weight="700">04 CONVERT</text><text x="15" y="59" fill="#284629" font-size="17" font-weight="700">Scale / offset</text><text x="15" y="88" fill="#627060" font-size="12">base-unit bridge</text></g><g transform="translate(715 145)"><rect width="145" height="118" rx="14" fill="#284629"/><text x="15" y="29" fill="#bfe5bc" font-size="12" font-weight="700">05 OUTPUT</text><text x="15" y="59" fill="white" font-size="17" font-weight="700">Quantity</text><text x="15" y="88" fill="#e0eadc" font-size="12">value + unit</text></g></g><g stroke="#567c54" stroke-width="3" marker-end="url(#a)"><path d="M181 204H198"/><path d="M351 204H368"/><path d="M521 204H538"/><path d="M691 204H708"/></g><rect x="35" y="310" width="825" height="88" rx="15" fill="white" stroke="#cbd9c6"/><text x="60" y="345" fill="#456b43" font-family="Arial" font-size="13" font-weight="700">INVARIANT</text><text x="60" y="375" fill="#284629" font-family="Georgia" font-size="24" font-weight="700">dim(q_source) = dim(q_target)</text><text x="490" y="363" fill="#627060" font-family="Arial" font-size="13">Absolute temperatures include offsets;</text><text x="490" y="383" fill="#627060" font-family="Arial" font-size="13">temperature intervals do not.</text></svg>

