<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter · Office Scientific Tools</title>
<style>body{margin:0;background:#10151b;color:#f4f6f8;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:54px 24px}.eyebrow{color:#5ee0bd;letter-spacing:.12em;font-size:12px;font-weight:700}h1{font-size:clamp(36px,6vw,70px);line-height:1;margin:10px 0 16px}p{color:#b5c0c9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#1a222b;border:1px solid #34404b;border-radius:18px;padding:24px}label{display:block;color:#aebbc5;font-size:13px;margin:14px 0 7px}input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #44515d;background:#10151b;color:#fff;font-size:15px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:9px;background:#5ee0bd;color:#0b211b;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:15px;background:#10151b;border-radius:9px;min-height:22px;color:#dffbf3}.wide{grid-column:1/-1}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><div class="eyebrow">PRODUCTIVITY · LOCAL PROCESSING</div><h1>Unit converter</h1><p>Convert familiar engineering units or evaluate dimensional expressions locally with Pint.</p><div class="grid"><section class="card"><h2>Convert a value</h2><label for="family">Family</label><select id="family">{% for family in families %}<option>{{ family }}</option>{% endfor %}</select><label for="value">Value</label><input id="value" value="1" type="number" step="any"><label for="from">From</label><select id="from"></select><label for="to">To</label><select id="to"></select><button id="convert">Convert</button><div id="convert-result" class="result"></div></section><section class="card"><h2>Expression mode</h2><p>Examples: <code>2 kg * 9.81 m/s^2 to N</code> or <code>100 degF to degC</code>.</p><label for="expression">Expression</label><input id="expression" value="2 kg * 9.81 m/s^2 to N"><button id="evaluate">Evaluate expression</button><div id="expression-result" class="result"></div></section></div></main>
<script>const families={{ families|tojson }};const family=document.querySelector('#family'),from=document.querySelector('#from'),to=document.querySelector('#to');function refresh(){const u=families[family.value];from.innerHTML=u.map(x=>`<option>${x}</option>`).join('');to.innerHTML=u.map(x=>`<option>${x}</option>`).join('');if(u.length>1)to.selectedIndex=1}family.onchange=refresh;refresh();async function post(url,body,target){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();target.textContent=d.ok?(d.formatted||d.result):`Error: ${d.error}`}document.querySelector('#convert').onclick=()=>post('/api/convert',{value:document.querySelector('#value').value,from_unit:from.value,to_unit:to.value},document.querySelector('#convert-result'));document.querySelector('#evaluate').onclick=()=>post('/api/expressions',{expression:document.querySelector('#expression').value},document.querySelector('#expression-result'));</script></body></html>
